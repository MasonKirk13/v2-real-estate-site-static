name: Deploy static preview

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare publish directory
        run: |
          mkdir publish
          cp index.html styles.css content.js script.js publish/
          cp -R about available-rentals buy consultation contact property-management reviews search-homes sell services publish/
      - name: Install SFTP client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Upload site to DreamHost over SFTP
        env:
          DREAMHOST_HOST: ${{ secrets.DREAMHOST_HOST }}
          DREAMHOST_USERNAME: ${{ secrets.DREAMHOST_USERNAME }}
          DREAMHOST_PASSWORD: ${{ secrets.DREAMHOST_PASSWORD }}
          DREAMHOST_PATH: ${{ secrets.DREAMHOST_PATH }}
        run: |
          lftp -u "$DREAMHOST_USERNAME","$DREAMHOST_PASSWORD" "sftp://$DREAMHOST_HOST:22" -e "
            set sftp:auto-confirm yes;
            mirror --reverse --delete --verbose publish \"$DREAMHOST_PATH\";
            quit
          "
